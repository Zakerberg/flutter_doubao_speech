name: doubao_speech
description: Flutter plugin for Doubao Speech-to-Speech real-time voice interaction SDK.
version: 0.0.1
homepage: https://github.com/yourusername/doubao_speech
repository: https://github.com/yourusername/doubao_speech

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: DoubaoSpeechPlugin
      android:
        package: com.example.doubao_speech
        pluginClass: DoubaoSpeechPlugin