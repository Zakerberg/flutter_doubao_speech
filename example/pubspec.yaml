name: doubao_speech_example
description: "Demonstrates how to use the doubao_speech plugin."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  doubao_speech:
    path: ../

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/aec.model